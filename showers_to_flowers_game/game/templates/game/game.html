{% extends 'game/base.html' %}
{% load static %}

{% block content %}
<div class="game-container">
    <!-- 🌟 Luxury Affirmation Banner derived from server-side context -->
    {% if daily_affirmation %}
    <div class="affirmation-banner" role="status" aria-live="polite">
        <p class="affirmation-text">{{ daily_affirmation }}</p>
    </div>
    {% endif %}

    <!-- 🎀 Aesthetic Scoreboard Header -->
    <header class="game-header">
        <h1 class="game-title">Showers to Flowers</h1>
        <div class="glam-counter">
            <span class="glam-icon">✨</span>
            <span class="glam-label">Glam Points:</span>
            <span id="glam-points-value" class="glam-value">{{ glam_points|default:0 }}</span>
        </div>
    </header>

    <!-- 🎮 Main Interactive Game Screen Canvas -->
    <main class="game-viewport">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </main>

    <!-- 🌸 Inclusive and Accessible Progress Interface -->
    <footer class="game-controls">
        <div class="progress-wrapper">
            <label id="growth-label" for="growthBar">Aesthetic Growth:</label>
            <div id="growthBar"
                 class="custom-progress-bar"
                 role="progressbar"
                 aria-labelledby="growth-label"
                 aria-valuenow="{{ current_growth|default:0 }}"
                 aria-valuemin="0"
                 aria-valuemax="100">
                <div id="growthProgress" class="progress-fill" style="width: {{ current_growth|default:0 }}%;"></div>
            </div>
            <span id="stage-badge" class="stage-badge">Seed Phase</span>
        </div>
    </footer>
</div>

<!-- Load modular frontend application configs -->
<script type="module" src="{% static 'game/js/game.js' %}?v=1.1"></script>
{% endblock %}
